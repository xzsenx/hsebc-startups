# Подключается в каждый location: в nginx add_header из location полностью
# заменяет заголовки уровня server, поэтому их нельзя объявить один раз наверху.

# CSP: скрипты только свои и SDK Telegram, никаких инлайн-скриптов и eval.
# style-src-attr 'unsafe-inline' нужен для style-атрибутов React (цвет аватара,
# размеры скелетонов) — внедрение стилей не исполняет код, в отличие от скриптов.
# frame-ancestors разрешает встраивание только в веб-версию Telegram: там мини-приложение
# открывается в iframe. Поэтому X-Frame-Options не ставим — он запретил бы и Telegram.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://telegram.org; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org; base-uri 'none'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
