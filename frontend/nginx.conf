# Второй рубеж против перебора паролей — до приложения: 10 запросов в минуту с IP
# на эндпоинты входа и регистрации. Основная логика лимитов — в бэкенде.
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    client_max_body_size 32k;

    # Файлы сборки с хешем в имени не меняются — кешируем навсегда.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location /api/auth/ {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy-api.conf;
    }

    location /api/ {
        include /etc/nginx/proxy-api.conf;
    }

    # SPA: неизвестные пути отдают index.html, маршрутизацию делает React Router.
    # index.html не кешируем — иначе после деплоя браузер держит ссылки на старые файлы.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
