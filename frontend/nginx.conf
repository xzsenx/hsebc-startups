server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # SPA: любой маршрут отдаём index.html, маршрутизацию делает React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Фронт и API живут на одном origin — поэтому в браузере нет CORS-преflight.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
